.pin-btn{

  transform:translate(-27%,-68%) scale(.95);

  filter:grayscale(.85) opacity(.75);

  pointer-events:none;

  position:absolute;

  z-index:8;

}
.lbl-img{
  width:100%;
  height:auto;
  display:block;
  mix-blend-mode:multiply;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.pin-btn:hover .lbl-wrap{
  animation-play-state:paused;
}
.pin-btn:hover .lbl-img{
  transform:translateY(-4px) scale(1.12);
}
@keyframes ribbonFloat{
  0%,100%{transform:translateY(0px)}

@keyframes pinBounce{

}

    b.strokeStyle='#e9f6fb';b.lineWidth=2;for(let x=20;x<WW;x+=70){b.beginPath();b.moveTo(x,585);b.quadraticCurveTo(x+14,575,x+28,585);b.moveTo(x+30,616);b.quadraticCurveTo(x+44,606,x+58,616);b.stroke();}
    b.fillStyle='#b98a54';b.fillRect(1090,552,180,96);b.strokeStyle='#111';b.lineWidth=2.4;b.strokeRect(1090,552,180,96);
    b.lineWidth=1.4;b.strokeStyle='rgba(60,30,10,.6)';for(let x=1104;x<1270;x+=16){b.beginPath();b.moveTo(x,552);b.lineTo(x,648);b.stroke();}
    skip=(x,y)=>(y>550&&y<650)||(x>1100&&x<1240)||(x>70&&x<890&&y>40&&y<500)||(x>1470&&x<2310&&y>680&&y<1060)||(x>1490&&x<2070&&y>70&&y<340);

/* ============================================================
   UPDATE & RENDER DUNIA
   ============================================================ */
function update(dt){
  P.t+=dt;
  let vx=0,vy=0;
  if(keys.ArrowLeft||keys.KeyA)vx--;if(keys.ArrowRight||keys.KeyD)vx++;
  if(keys.ArrowUp||keys.KeyW)vy--;if(keys.ArrowDown||keys.KeyS)vy++;
  let an=0;
  if(!vx&&!vy&&AN.m>0){vx=AN.x;vy=AN.y;an=AN.m;}
  const run=keys.ShiftLeft||keys.ShiftRight;let sp=run?210:120;if(an)sp=an>.85?200:40+80*(an/.85);
  const L=Math.hypot(vx,vy);let mv=0;
  if(L){
    vx/=L;vy/=L;
    const nx=P.x+vx*sp*dt,ny=P.y+vy*sp*dt;
    if(!blocked(nx,P.y)){mv+=Math.abs(nx-P.x);P.x=nx;}
    if(!blocked(P.x,ny)){mv+=Math.abs(ny-P.y);P.y=ny;}
    P.dir=Math.abs(vx)>Math.abs(vy)?(vx<0?'left':'right'):(vy<0?'up':'down');
  }
  P.moving=mv>.01;
}

function render(dt){
  const vw=W/Z,vh=H/Z;
  const tx=Math.max(0,Math.min(WW-vw,P.x-vw/2)),ty=Math.max(0,Math.min(WH-vh,P.y-vh/2-20));
  if(cam.s){cam.x=tx;cam.y=ty;cam.s=0;}else{const k=Math.min(1,dt*6);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;}
  g.setTransform(DPR,0,0,DPR,0,0);g.fillStyle='#f6f3eb';g.fillRect(0,0,W,H);
  g.setTransform(DPR*Z,0,0,DPR*Z,-cam.x*DPR*Z,-cam.y*DPR*Z);
  g.drawImage(bg,0,0,WW,WH);ink(g,2.2);g.textAlign='center';
  Object.assign(PL,cfg,{dir:P.dir,moving:P.moving,t:P.t,expr:'ramah'});
  const E=[];
  for(const p of PR){if(p.vis&&!p.vis())continue;if(p.x+(p.w||0)<cam.x-320||p.x>cam.x+vw+320||p.y<cam.y-60||p.y>cam.y+vh+340)continue;const d=PT[p.t];E.push([p.by!==undefined?p.by:p.y,()=>d.draw(p)]);}
  E.push([P.y,()=>drawChar(g,P.x,P.y,PL)]);
  E.sort((a,b)=>a[0]-b[0]);E.forEach(e=>e[1]());
  for(const p of PR){const d=PT[p.t];if(d.ov&&(!p.vis||p.vis())&&p.x>cam.x-320&&p.x<cam.x+vw+320&&p.y>cam.y-60&&p.y<cam.y+vh+340)d.ov(p);}
  for(const id of tgtIds()){
    const p=PID[id];if(!p)continue;const rg=p.rg||PT[p.t].rg;
    g.save();g.strokeStyle='#d62d2d';g.lineWidth=3;g.setLineDash([9,7]);g.lineDashOffset=-t*18;g.beginPath();g.ellipse(p.x+rg[0],p.y+rg[1],rg[2],rg[3],0,0,7);g.stroke();g.restore();
  }
  const n=mode==='play'?near():null;
  if(n){
    const y=n.by+Math.sin(t*7)*3;
    g.fillStyle='#fff';g.strokeStyle='#111';g.lineWidth=2.5;
    g.beginPath();g.arc(n.bx,y,13,0,7);g.fill();g.stroke();
    g.beginPath();g.moveTo(n.bx-5,y+11);g.lineTo(n.bx,y+20);g.lineTo(n.bx+5,y+11);g.fillStyle='#fff';g.fill();g.stroke();
    g.beginPath();g.arc(n.bx,y,11,0.9,2.2);g.fillStyle='#fff';g.strokeStyle='#fff';g.stroke();
    g.fillStyle='#d62d2d';g.font='bold 22px "Patrick Hand",cursive';g.fillText('!',n.bx,y+7);
    ink(g,2.2);
  }
}

/* ============================================================
   DIALOG (efek ketik, potret, pilihan)
   ============================================================ */
const D={on:false,L:[],i:0,p:0,n:-1,full:'',cb:null,sel:0,ch:null,done:false,face:null};
function say(L,cb){D.L=L;D.i=0;D.cb=cb||null;D.on=true;P.moving=false;M('dialog');$('#dlg').classList.remove('hide');setLine();}
function setLine(){
  const l=D.L[D.i];
  D.full=l.t.replace(/\{n\}/g,cfg.name);D.p=0;D.n=-1;D.done=false;D.sel=0;D.ch=l.ch||null;
  const who=l.w==='m'?NPC.name:l.w==='p'?cfg.name:'';
  $('#nm').textContent=who;$('#nm').classList.toggle('hide',!who);$('#por').classList.toggle('hide',!who);
  D.face=l.w?{w:l.w,f:l.f||'ramah'}:null;paintPortrait();
  $('#ch').innerHTML='';$('#nx').style.visibility='hidden';$('#tx').textContent='';
}
function typeUpdate(dt){
  if(!D.on||D.done)return;
  D.p+=dt*42;const n=Math.min(D.full.length,D.p|0);
  if(n!==D.n){D.n=n;if(n%2===0&&D.face)blip(D.face.w==='m'?300:480);$('#tx').textContent=D.full.slice(0,n);}
  if(n>=D.full.length){D.done=true;endLine();}
}
function endLine(){
  if(D.ch){
    const c=$('#ch');c.innerHTML='';
    D.ch.forEach((x,i)=>{const b=document.createElement('button');b.className='btn'+(i===D.sel?' sel':'');b.textContent=x.l;b.onpointerdown=ev=>ev.stopPropagation();b.onclick=ev=>{ev.stopPropagation();choose(i);};b.onpointerenter=()=>{D.sel=i;refSel();};c.appendChild(b);});
  }else $('#nx').style.visibility='visible';
}
function refSel(){[...$('#ch').children].forEach((b,i)=>b.classList.toggle('sel',i===D.sel));}
function selCh(d){D.sel=(D.sel+d+D.ch.length)%D.ch.length;refSel();}
function choose(i){const c=D.ch[i];D.cb=null;closeD();c.fn();}
function closeD(){D.on=false;D.ch=null;D.face=null;$('#dlg').classList.add('hide');M('play');}
function adv(){
  if(!D.on)return;
  if(!D.done){D.p=1e9;return;}
  if(D.ch)return;
  D.i++;
  if(D.i>=D.L.length){const c=D.cb;D.cb=null;closeD();if(c)c();}else setLine();
}
$('#dlg').addEventListener('pointerdown',()=>{ensureAudio();adv();});

/* ============================================================
   MISI (tiap daerah punya 2 tantangan berbeda, lalu lapor)
   ============================================================ */
const lines=(a,f)=>a.map(t=>({w:'m',f:f||'serius',t}));
function curT(){return (stage>=1&&stage<=R.tasks.length)?R.tasks[stage-1]:null;}
function tgtIds(){
  const T=curT();
  if(!T)return stage===R.tasks.length+1?['npc']:[];
  if(T.ty==='cari')return T.tgt.filter(i=>!RS.got[i]);
  if(T.ty==='rute')return [T.d.seq[Math.min(RS.ri,T.d.seq.length-1)]];
  if(T.ty==='saksi')return T.tgt.every(i=>RS.talked[i])?['npc']:T.tgt.filter(i=>!RS.talked[i]);
  return T.tgt;
}
function setHud(){
  const k=REG.indexOf(R)+1,n=R.tasks.length;
  $('#hudt').textContent='Kasus #'+k+' · '+R.nama;
  let o;
  if(stage===0)o=free?'Free Roam: jelajahi dan periksa objek budaya. Bicara dengan '+NPC.name+' bila ingin memulai misi.':'Bicaralah dengan '+NPC.name+'.';
  else if(stage<=n)o=R.tasks[stage-1].hud();
  else if(stage===n+1)o='Lapor ke '+NPC.name+'.';
  else o='Kasus selesai! Jelajahi bebas atau kembali ke Peta.';
  $('#obj').textContent='▸ '+o;
}
function stg(n){stage=n;ST[R.id]=n;save();setHud();}
function solved(T){if(curT()!==T)return;stg(stage+1);say(T.win);}

function talkNPC(){
  const n=R.tasks.length;
  if(stage===0){
    say([{w:'m',f:'senang',t:R.greet},
      {w:'m',f:'ramah',t:'Mau langsung menyelidiki kasusnya, atau berkeliling dulu?',ch:[
        {l:'Mulai Misi',fn:()=>{free=false;stg(1);say(lines(R.story).concat([{w:'p',f:'senang',t:'Siap! Penyelidikan dimulai.'}]));}},
        {l:'Free Roam',fn:()=>{free=true;setHud();say([{w:'m',f:'senang',t:'Silakan berkeliling dan periksa semua objek budaya di sini.'},{w:'m',f:'ramah',t:'Bicaralah lagi padaku bila siap menyelidiki.'}]);}}
      ]}]);
  }else if(stage<=n){
    const T=curT();
    if(T.ty==='saksi'&&T.tgt.every(i=>RS.talked[i]))return askLiar(T);
    say([{w:'m',f:'serius',t:T.rem}]);
  }else if(stage===n+1){
    const k=REG.indexOf(R)+1;
    say([{w:'m',f:'senang',t:R.rep[0]},{w:'p',f:'ramah',t:R.rep[1]},{w:'m',f:'senang',t:R.rep[2]},
      {w:'',t:'Di balik gulungan terselip serpihan kartu hitam yang bertuliskan: "'+R.piece+'". Kepingan Sandi #'+k+' kau simpan.'}],
      ()=>{DONE[R.id]=true;stg(n+2);victory();});
  }else say([{w:'m',f:'senang',t:'Terima kasih, Detektif {n}. '+R.nama+' aman berkat kejelianmu. Daerah lain menunggu, buka Peta kapan saja.'}]);
}

function interact(id){
  const p=PID[id];if(!p)return;
  if(id==='npc')return talkNPC();
  const T=curT();
  if(T&&T.tgt.includes(id))return startTask(T,id);
  const inf=typeof p.info==='function'?p.info():p.info;
  say([{w:'',t:inf||'Tidak ada yang mencurigakan di sini.'}]);
}
function startTask(T,id){
  const ty=T.ty;
  if(ty==='cari')return collect(T,id);
  if(ty==='rute')return stasiun(T,id);
  if(ty==='saksi')return saksi(T,id);
  say(T.intro,()=>({susun:gSusun,urut:gUrut,cocok:gCocok,nada:gNada,kuis:gKuis}[ty])(T));
}
function collect(T,id){
  const p=PID[id];RS.got[id]=true;setHud();
  say([{w:'',t:p.txt}],()=>{if(T.tgt.every(i=>RS.got[i]))solved(T);});
}
function stasiun(T,id){
  const seq=T.d.seq,p=PID[id];
  if(RS.ri>0&&id===seq[RS.ri-1])return say([{w:'',t:'Kau sudah berdoa di sini. Lanjutkan ke pelinggih berikutnya.'}]);
  if(id===seq[RS.ri]){RS.ri++;setHud();return say([{w:'',t:p.txt}],()=>{if(RS.ri>=seq.length)solved(T);});}
  RS.ri=0;setHud();
  say([{w:'',t:'Doa terhenti karena urutannya keliru. Ulangi dari awal: '+T.d.names+'.'}]);
}
function saksi(T,id){
  const p=PID[id];RS.talked[id]=true;setHud();
  say(p.stmt,()=>{if(T.tgt.every(i=>RS.talked[i]))askLiar(T);});
}
function askLiar(T){
  say([{w:'m',f:'serius',t:'Ketiganya sudah bicara. Menurutmu, siapa yang berbohong, {n}?',ch:T.tgt.map(i=>({l:PID[i].o.name,fn:()=>{
    if(i===T.d.liar)solved(T);
    else say([{w:'m',f:'serius',t:'Hmm, ceritanya masuk akal. Ingat kondisi malam itu, lalu cari yang tidak cocok. Bicaralah lagi denganku bila sudah yakin.'}]);
  }}))}]);
}

/* Mini-game: susun urutan (kata atau langkah) */
function arrange(o){
  const ans=[],bank=shuffle(o.items.concat(o.extra||[]).map((w,i)=>({w,id:i}))),goal=o.items.join('|');
  const cls='btn blk'+(o.long?' long':'');
  const r=()=>{
    modal('<h2>'+o.title+'</h2>'+(o.quote?'<div class="jv">"'+o.quote+'"</div>':'')+'<div>'+o.prompt+'</div>'+
      '<div class="zone">'+ans.map(b=>'<button class="'+cls+'" data-a="'+b.id+'">'+b.w+'</button>').join('')+'</div>'+
      '<div>'+bank.map(b=>'<button class="'+cls+'" data-b="'+b.id+'">'+b.w+'</button>').join('')+'</div>'+
      '<p id="fb" style="min-height:28px;margin:8px 0"></p><button class="btn" id="ck">Periksa</button> <button class="btn" id="cl">Tutup</button>');
    const el=$('#mb');
    el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=ans.findIndex(x=>x.id==b.dataset.a);bank.push(...ans.splice(i,1));r();});
    el.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const i=bank.findIndex(x=>x.id==b.dataset.b);ans.push(...bank.splice(i,1));r();});
    $('#cl').onclick=closeM;
    $('#ck').onclick=()=>{
      const s=ans.map(x=>x.w).join('|'),f=$('#fb');
      if(s===goal){f.textContent='✔ Benar!';f.style.color='#1b7a2b';setTimeout(()=>{closeM();o.onWin();},900);}
      else{f.textContent=ans.length?'✘ Belum tepat, coba susun ulang.':'Klik blok untuk menyusunnya.';f.style.color='#c0392b';shakeEl();}
    };
  };
  r();
}
function gSusun(T){arrange({title:T.d.title,quote:T.d.quote,prompt:'Susun terjemahannya dalam Bahasa Indonesia:',items:T.d.words,extra:T.d.extra,onWin:()=>solved(T)});}
function gUrut(T){arrange({title:T.d.title,prompt:T.d.prompt,items:T.d.steps,long:true,onWin:()=>solved(T)});}

/* Mini-game: pasangkan istilah */
function gCocok(T){
  const pr=T.d.pairs,L=pr.map((p,i)=>({t:p[0],i})),Rr=shuffle(pr.map((p,i)=>({t:p[1],i})));
  let sel=null;const ok={};
  const r=(msg,bad)=>{
    modal('<h2>'+T.d.title+'</h2><div>'+T.d.prompt+'</div><div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px"><div style="flex:1;min-width:150px">'+
      L.map(x=>'<button class="btn opt'+(ok[x.i]?' ok':'')+(sel===x.i?' sel':'')+'" data-l="'+x.i+'">'+x.t+'</button>').join('')+'</div><div style="flex:1;min-width:150px">'+
      Rr.map(x=>'<button class="btn opt'+(ok[x.i]?' ok':'')+'" data-r="'+x.i+'">'+x.t+'</button>').join('')+'</div></div>'+
      '<p style="min-height:28px;color:'+(bad?'#c0392b':'#1b7a2b')+'">'+(msg||'')+'</p><button class="btn" id="cl">Tutup</button>');
    const el=$('#mb');if(bad)shakeEl();
    el.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const i=+b.dataset.l;if(ok[i])return;sel=i;r('Sekarang pilih artinya di kolom kanan.',false);});
    el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.r;if(ok[i])return;
      if(sel===null)return r('Pilih istilahnya dulu di kolom kiri.',true);
      if(sel===i){ok[i]=1;sel=null;if(Object.keys(ok).length>=pr.length){closeM();solved(T);}else r('✔ Cocok!',false);}
      else{sel=null;r('✘ Belum cocok, coba lagi.',true);}
    });
    $('#cl').onclick=closeM;
  };
  r('',false);
}

/* Mini-game: ulangi nada angklung */
let NTOK=0;
function tone(f){if(!AC)return;try{const o=AC.createOscillator(),v=AC.createGain();o.type='triangle';o.frequency.value=f;v.gain.value=.12;o.connect(v);v.connect(AC.destination);o.start();v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.4);o.stop(AC.currentTime+.45);}catch(e){}}
function gNada(T){
  const tok=++NTOK,F=[262,330,392,523],C=['#e8b04a','#9bc46a','#6fb7d6','#f08a7e'],NM=['Do','Mi','Sol','Do tinggi'],lens=[3,4,5];
  let round=0,seq=[],pos=0,listen=false;
  const ok=()=>mode==='modal'&&NTOK===tok&&$('#nf');
  modal('<h2>'+T.d.title+'</h2><div>'+T.d.prompt+'</div><div style="display:flex;gap:10px;justify-content:center;margin:14px 0">'+
    F.map((f,i)=>'<button class="btn nb" style="background:'+C[i]+'" data-i="'+i+'">'+NM[i]+'</button>').join('')+'</div><p id="nf" style="min-height:28px"></p><button class="btn" id="cl">Tutup</button>');
  const flash=i=>{const b=$('#mb').querySelectorAll('.nb')[i];if(b){b.classList.add('lit');setTimeout(()=>b.classList.remove('lit'),300);}tone(F[i]);};
  const msg=m=>{if(ok())$('#nf').textContent=m;};
  const play=()=>{
    listen=false;pos=0;msg('Simak nadanya... ('+(round+1)+'/'+lens.length+')');
    seq.forEach((n,i)=>setTimeout(()=>{if(ok())flash(n);},700+i*650));
    setTimeout(()=>{if(ok()){listen=true;msg('Giliranmu! Ulangi nadanya.');}},700+seq.length*650);
  };
  const newRound=()=>{seq=Array.from({length:lens[round]},()=>Math.random()*4|0);play();};
  $('#mb').querySelectorAll('.nb').forEach(b=>b.onclick=()=>{
    if(!listen)return;
    const i=+b.dataset.i;flash(i);
    if(i===seq[pos]){
      pos++;
      if(pos>=seq.length){listen=false;round++;
        if(round>=lens.length){msg('✔ Gembok terbuka!');setTimeout(()=>{if(ok()){closeM();solved(T);}},800);}
        else{msg('✔ Benar! Ronde berikutnya...');setTimeout(()=>{if(ok())newRound();},900);}}
    }else{listen=false;msg('✘ Salah nada! Simak lagi.');shakeEl();setTimeout(()=>{if(ok())play();},900);}
  });
  $('#cl').onclick=closeM;
  setTimeout(()=>{if(ok())newRound();},500);
}

/* Mini-game: kuis budaya */
function gKuis(T){
  const Q=T.d.qs.map(q=>({q:q[0],o:shuffle(q[1].map((x,i)=>({t:x,ok:i===0})))}));
  let qi=0;
  const r=(msg,bad)=>{
    const q=Q[qi];
    modal('<h2>'+T.d.title+'</h2><div>Gembok '+(qi+1)+' dari '+Q.length+'</div><p style="margin:10px 0"><b>'+q.q+'</b></p>'+
      q.o.map((x,i)=>'<button class="btn opt" data-i="'+i+'">'+x.t+'</button>').join('')+
      '<p style="min-height:28px;margin:8px 0;color:'+(bad?'#c0392b':'#1b7a2b')+'">'+(msg||'')+'</p><button class="btn" id="cl">Tutup</button>');
    if(bad)shakeEl();
    $('#mb').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(q.o[b.dataset.i].ok){qi++;if(qi>=Q.length){closeM();solved(T);}else r('✔ Gembok terbuka! Lanjut ke gembok berikutnya.',false);}
      else r('✘ Salah! Peti bergetar. Coba lagi.',true);
    });
    $('#cl').onclick=closeM;
  };
  r('',false);
}

/* Layar kemenangan */
function victory(){
  const k=cnt();
  modal('<div style="text-align:center"><h2>KASUS #'+(REG.indexOf(R)+1)+' TERPECAHKAN!</h2><canvas id="bd" width="440" height="440" style="width:220px;height:220px"></canvas>'+
    '<div style="font-size:26px"><b>Lencana Budaya:</b><br>"Detektif '+R.badge.replace(/\w\S*/g,w=>w[0]+w.slice(1).toLowerCase())+'"</div>'+
    '<p>Diberikan kepada <b>'+esc(cfg.name)+'</b>. Kepingan Sandi terkumpul: <b>'+k+' / '+REG.length+'</b></p>'+
    '<button class="btn" id="vm">Kembali ke Peta</button> <button class="btn" id="fr">Free Roam</button></div>');
  const b=$('#bd').getContext('2d');b.setTransform(2,0,0,2,0,0);ink(b,3);
  b.translate(110,110);
  b.fillStyle=R.bc;b.beginPath();b.arc(0,0,98,0,7);b.fill();b.stroke();
  b.fillStyle='#fff7da';b.beginPath();b.arc(0,0,82,0,7);b.fill();b.stroke();
  b.save();b.setLineDash([6,6]);b.lineWidth=2;b.beginPath();b.arc(0,0,72,0,7);b.stroke();b.restore();
  b.fillStyle='#d9534f';b.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rd=i%2?16:38;b.lineTo(Math.cos(a)*rd,-26+Math.sin(a)*rd);}b.closePath();b.fill();b.stroke();
  b.fillStyle='#111';b.textAlign='center';b.font='24px "Patrick Hand",cursive';b.fillText('DETEKTIF',0,38);b.font='17px "Patrick Hand",cursive';b.fillText(R.badge,0,62);
  $('#fr').onclick=()=>{free=true;closeM();};
  $('#vm').onclick=()=>{closeM();toMap();};
}

/* ============================================================
   ALUR: MENU, NAMA, LORE, PETA, MASUK DAERAH
   ============================================================ */
function prolog(first){
  const pg=[
    'Sejak zaman kerajaan, para pecinta budaya Nusantara membentuk perkumpulan rahasia bernama <b>Komunitas KarsaLoka</b>. Di setiap daerah ada satu <b>Penjaga Loka</b>, detektif budaya yang menjaga pusaka, resep, naskah, dan nada leluhur.',
    'Belakangan, komplotan misterius bernama <b>Bayang Sengkala</b> mencuri pusaka budaya di banyak daerah sekaligus. Setiap pencurian meninggalkan satu tanda: kartu hitam bergambar bulan sabit.',
    'Kamu, <b>'+esc(cfg.name)+'</b>, detektif muda KarsaLoka, dipanggil untuk membantu para Penjaga Loka. Pecahkan kasus di tiap daerah, kumpulkan Kepingan Sandi, dan ungkap siapa dalang di balik Bayang Sengkala.'];
  let i=0;
  const r=()=>{
    modal('<h2>'+(i===0?'Prolog':'Prolog '+(i+1)+'/3')+'</h2><div class="jv" style="font-family:inherit;font-size:23px;line-height:1.35">'+pg[i]+'</div><button class="btn" id="pn">'+(i<2?'Lanjut ▶':(first?'Mulai Misi ▶':'Tutup'))+'</button>');
    $('#pn').onclick=()=>{if(i<2){i++;r();}else closeM();};
  };
  r();
}
function howto(){modal('<h2>Cara Bermain</h2><p><b>Jalan:</b> WASD / Panah (HP: joystick).<br><b>Lari:</b> tahan Shift (HP: dorong joystick sampai ujung).<br><b>Interaksi:</b> Spasi / Enter / Z (HP: tombol A) saat muncul tanda <b>!</b>.</p><p>Pilih daerah di Peta, ikuti Quest Tracker dan lingkaran merah putus-putus. Selesaikan tantangan budaya di tiap daerah lalu lapor ke Penjaga Loka untuk mendapatkan Lencana Budaya.</p><button class="btn" id="cl">Tutup</button>');$('#cl').onclick=closeM;}

function toMenu(){scene='ui';['#hud','#map','#card'].forEach(s=>$(s).classList.add('hide'));$('#menu').classList.remove('hide');M('menu');}
function openCard(){$('#menu').classList.add('hide');$('#card').classList.remove('hide');$('#nama').value=cfg.name==='Detektif'?'':cfg.name;M('create');}
function toMap(){
  scene='ui';$('#hud').classList.add('hide');$('#card').classList.add('hide');$('#menu').classList.add('hide');$('#map').classList.remove('hide');
  buildMap();M('map');
  if(cnt()>=REG.length&&!EPI)setTimeout(()=>{if(mode==='map')epilog();},400);
}
function leaveRegion(){ST[R.id]=stage;save();toMap();}

function buildMap(){
  const dn=cnt();
  let mk='';
  REG.forEach((r,i)=>{
    const d=DONE[r.id],cl=d?'dn':'go',delay=(i*0.35).toFixed(2);
    mk+='<div class="mk" style="left:'+r.mx+'%;top:'+r.my+'%">'+
      '<button type="button" class="pin-btn '+cl+'" data-id="'+r.id+'" title="Selidiki '+r.nama+'">'+
        '<img src="'+PIN_IMG+'" alt="Pin '+r.nama+'" class="pin-img" draggable="false">'+
        '<span class="pin-badge">'+(d?'✔':(i+1))+'</span>'+
        '<div class="lbl-wrap" style="animation-delay:'+delay+'s">'+
          '<img src="'+r.lbl+'" alt="'+r.nama+'" class="lbl-img" style="transform:translate('+r.lx+'%,'+r.ly+'%)" draggable="false">'+
        '</div>'+
      '</button>'+
    '</div>';
  });
  LOCK.forEach((l,i)=>{
    const delay=((i+4)*0.35).toFixed(2);
    mk+='<div class="mk" style="left:'+l.mx+'%;top:'+l.my+'%">'+
      '<button type="button" class="pin-btn lk" data-lock="'+l.nama+'" title="'+l.nama+' (Segera Hadir)">'+
        '<img src="'+PIN_IMG+'" alt="Pin '+l.nama+'" class="pin-img" draggable="false">'+
        '<span class="pin-badge">?</span>'+
        '<div class="lbl-wrap" style="animation-delay:'+delay+'s">'+
          '<img src="'+l.lbl+'" alt="'+l.nama+'" class="lbl-img" style="transform:translate('+l.lx+'%,'+l.ly+'%)" draggable="false">'+
        '</div>'+
      '</button>'+
    '</div>';
  });
  const msg=REG.map(r=>DONE[r.id]?r.piece:'▒▒▒▒▒').join(' ');
  $('#mpb').innerHTML='<h2>Peta Misi Nusantara</h2><div>Pilih daerah untuk menyelidiki kasus pencurian Komplotan Bayang Sengkala. Semangat, Detektif '+esc(cfg.name)+'!</div>'+
    '<div style="overflow-x:auto;padding:4px 0 12px"><div id="mapw" style="min-width:640px">'+
    '<img id="mimg" src="'+MAP_IMG+'" alt="Peta Nusantara" draggable="false">'+
    mk+'</div></div>'+
    '<div id="sandi"><b>Pesan sandi komplotan ('+dn+'/'+REG.length+'):</b><br>"'+msg+'"</div>'+
    '<p style="margin:10px 0 0"><button class="btn" id="mm">Menu Utama</button></p>';
  $('#mpb').querySelectorAll('.pin-btn[data-id]').forEach(b=>{
    b.addEventListener('pointerdown',e=>e.stopPropagation());
    b.onclick=e=>{e.stopPropagation();ensureAudio();brief(REG.find(r=>r.id===b.dataset.id));};
  });
  $('#mpb').querySelectorAll('.pin-btn[data-lock]').forEach(b=>{
    b.addEventListener('pointerdown',e=>e.stopPropagation());
    b.onclick=e=>{e.stopPropagation();modal('<h2>'+b.dataset.lock+'</h2><p>Misi di daerah ini akan segera hadir. Selesaikan dulu kasus yang terbuka untuk mengungkap jejak Bayang Sengkala.</p><button class="btn" id="cl">Tutup</button>');$('#cl').onclick=closeM;};
  });
  $('#mm').onclick=toMenu;
}
function brief(r){
  const k=REG.indexOf(r)+1,s=DONE[r.id]?'✔ Selesai (boleh dimainkan lagi)':(ST[r.id]>0?'Sedang diselidiki':'Belum dimulai');
  modal('<h2>'+r.nama+'</h2><div class="jv"><b>Kasus #'+k+':</b> '+r.kasus+'</div><p>Penjaga Loka: <b>'+r.npc.name+'</b><br>Tantangan: '+r.lab+'<br>Status: '+s+'</p><button class="btn" id="mu">Mulai Misi</button> <button class="btn" id="cl">Tutup</button>');
  $('#cl').onclick=closeM;
  $('#mu').onclick=()=>{closeM();enterRegion(r.id);};
}
function showRT(){
  const k=REG.indexOf(R)+1;$('#rt1').textContent=R.nama;$('#rt2').textContent='Kasus #'+k+': '+R.kasus;
  const e=$('#rt');e.classList.remove('on');void e.offsetWidth;e.classList.add('on');
}
function enterRegion(id){
  R=REG.find(r=>r.id===id);NPC=Object.assign({},R.npc,{npc:true,dir:'down',expr:'ramah',t:0});
  stage=ST[id]||0;free=false;RS={got:{},talked:{},ri:0};
  prep();buildBG(R);P.x=R.spawn[0];P.y=R.spawn[1];P.dir='up';cam.s=1;scene='world';
  $('#map').classList.add('hide');$('#hud').classList.remove('hide');
  M('play');setHud();showRT();
  if(stage===0)setTimeout(()=>{if(mode==='play'&&R&&R.id===id&&stage===0)talkNPC();},900);
}

/* ---------- epilog ---------- */
function epilog(){
  EPI=true;save();
  modal('<h2>Epilog: Pesan Sandi</h2><div class="jv" style="font-family:inherit;font-size:23px;line-height:1.35">Keempat Kepingan Sandi disusun menjadi satu pesan:<br><br><b>"'+PIECES.join(' ')+'"</b></div>'+
    '<p>Mbah Loka mengumpulkan semua Penjaga Loka. Pesan itu menunjuk ke wilayah paling timur Nusantara, tempat sang dalang Bayang Sengkala bersembunyi.</p><p><b>Bersambung...</b> Misi di Kalimantan, Sulawesi, dan Papua akan segera hadir.</p><button class="btn" id="cl">Kembali ke Peta</button>');
  $('#cl').onclick=closeM;

/* ============================================================
   JOYSTICK ANALOG
   ============================================================ */
const js=$('#js'),kn=$('#kn'),AN={x:0,y:0,m:0};
let jsP=null,jsTid=null;
function jsSet(cx,cy){
  const r=js.getBoundingClientRect(),dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2),d=Math.hypot(dx,dy),mx=r.width/2-14,dz=10;
  const c=Math.min(d,mx),ux=d?dx/d:0,uy=d?dy/d:0;
  kn.style.transform='translate('+(ux*c)+'px,'+(uy*c)+'px)';
  if(d<dz){AN.m=0;AN.x=AN.y=0;}
  else{AN.m=Math.min(1,(d-dz)/(mx-dz));AN.x=ux;AN.y=uy;}
}
function jsEnd(){AN.m=0;AN.x=AN.y=0;kn.style.transform='';}
js.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();jsP=e.pointerId;try{js.setPointerCapture(e.pointerId);}catch(_){}jsSet(e.clientX,e.clientY);});
js.addEventListener('pointermove',e=>{if(e.pointerId===jsP)jsSet(e.clientX,e.clientY);});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>js.addEventListener(ev,e=>{if(e.pointerId===jsP){jsP=null;jsEnd();}}));
js.addEventListener('touchstart',e=>{e.preventDefault();ensureAudio();const t0=e.changedTouches[0];jsTid=t0.identifier;jsSet(t0.clientX,t0.clientY);},{passive:false});
js.addEventListener('touchmove',e=>{e.preventDefault();for(const t0 of e.changedTouches)if(t0.identifier===jsTid)jsSet(t0.clientX,t0.clientY);},{passive:false});
['touchend','touchcancel'].forEach(ev=>js.addEventListener(ev,e=>{for(const t0 of e.changedTouches)if(t0.identifier===jsTid){jsTid=null;jsEnd();}}));
js.oncontextmenu=e=>e.preventDefault();
$('#ab').onpointerdown=e=>{e.preventDefault();ensureAudio();if(mode==='play'){const o=near();if(o)interact(o.p.id);}};

/* ============================================================
   INPUT & TOMBOL
   ============================================================ */
addEventListener('keydown',e=>{
  if(mode==='create'||mode==='menu'||mode==='map')return;
  const c=e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(c))e.preventDefault();
  keys[c]=true;
  if(e.repeat)return;
  ensureAudio();
  const act=c==='Enter'||c==='Space'||c==='KeyZ';
  if(mode==='dialog'){
    if(D.ch&&D.done){
      if(c==='ArrowUp'||c==='ArrowLeft'||c==='KeyW'||c==='KeyA')selCh(-1);
      else if(c==='ArrowDown'||c==='ArrowRight'||c==='KeyS'||c==='KeyD')selCh(1);
      else if(act)choose(D.sel);
    }else if(act)adv();
    return;
  }
  if(mode==='modal'){if(c==='Escape')closeM();return;}
  if(mode==='play'&&act){const o=near();if(o)interact(o.p.id);}
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.addEventListener('click',e=>{if(e.target.blur&&e.target.tagName==='BUTTON')e.target.blur();});
cv.addEventListener('pointerdown',()=>ensureAudio());

$('#bs').onclick=()=>{ensureAudio();openCard();};
$('#bl').onclick=()=>{ensureAudio();prolog(false);};
$('#bh').onclick=()=>{ensureAudio();howto();};
$('#go').onclick=()=>{
  ensureAudio();
  cfg.name=($('#nama').value.trim()||'Detektif').slice(0,14);
  save();toMap();
  if(!PRO){PRO=true;save();prolog(true);}
};
$('#nama').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click();});
document.addEventListener('contextmenu',e=>{if(e.target.tagName!=='INPUT')e.preventDefault();});
$('#mp').onclick=()=>{if(mode==='play')leaveRegion();};

/* ============================================================
   LOOP
   ============================================================ */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  if(mode==='create')drawPreview();
  else if(mode==='menu')drawMenu();
  else if(scene==='world'){if(mode==='play')update(dt);render(dt);}
  typeUpdate(dt);
  requestAnimationFrame(loop);
}
toMenu();
requestAnimationFrame(loop);
</script>
